services:
  - type: web
    name: statusmarket-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SITE_URL
        sync: false

  - type: web
    name: statusmarket-web
    runtime: static
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_SITE_URL
        sync: false
    routes:
      # Must match the real URL of the deployed API service (Render doesn't
      # support referencing another service's URL here). Update this if the
      # API service is ever recreated under a different onrender.com URL.
      - type: rewrite
        source: /og/*
        destination: https://statusmarketapi.onrender.com/og/*
      - type: rewrite
        source: /*
        destination: /index.html
